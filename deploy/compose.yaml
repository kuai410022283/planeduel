name: planeduel

# 生产用 Compose 模板。可在此文件旁放 .env：
#   PLANEDUEL_VERSION=0.9.8
#   PLANEDUEL_BIND=0.0.0.0
#   PLANEDUEL_PORT=28082
#   PUID=1000
#   PGID=1000
#   TZ=Asia/Shanghai
#
# 安全提示：游戏端口可以对外；管理口 18088 **务必**只绑到 127.0.0.1，
# 因为管理权限按入口判定（本机回环 = 管理员）。

services:
  planeduel:
    image: laoknas/planeduel:${PLANEDUEL_VERSION:-latest}
    container_name: planeduel
    restart: unless-stopped
    init: true
    ports:
      - "${PLANEDUEL_BIND:-0.0.0.0}:${PLANEDUEL_PORT:-28082}:28082"
      - "127.0.0.1:18088:18088"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # 容器里没有飞牛网关，所以默认把对外端口打开
      PD_PUBLIC_PORT: ${PLANEDUEL_PORT:-28082}
      PD_PUBLIC_PORT_ENABLED: "1"
    volumes:
      - planeduel-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  planeduel-data:
