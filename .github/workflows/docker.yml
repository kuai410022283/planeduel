name: docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号（不带 v，例如 0.9.8）"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/kuai410022283/planeduel
  DOCKERHUB_IMAGE: laoknas/planeduel

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # secrets 不能直接写在 if 里，这里先落到 env 再判断
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub（仅在配置了 secrets 时）
        if: env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: 确定要推送的镜像列表
        id: images
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "list<<EOF"
            echo "${GHCR_IMAGE}"
            if [ -n "${DH_TOKEN:-}" ]; then
              echo "${DOCKERHUB_IMAGE}"
            fi
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest

      - name: 构建并推送（linux/amd64 + linux/arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
